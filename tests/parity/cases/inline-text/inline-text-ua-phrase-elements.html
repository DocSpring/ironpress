<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>phrase elements: mark, cite, var, dfn, abbr, q</title>
<style>
  @page { size: 360px 144px; margin: 0; }
  html { font-family: ParitySans; font-size: 16px; line-height: 24px; background: #ffffff; }
  body { margin: 12px; }
  p { margin: 0 0 6px; }
</style>
</head>
<body>
  <p>Paid <mark>in full</mark> per <cite>Terms</cite>, rate <var>r</var>, <dfn>net</dfn>.</p>
  <p><abbr title="Goods and Services Tax">GST</abbr> and <abbr>VAT</abbr> apply.</p>
  <p>She wrote <q>pay by <q>Friday</q></q> twice.</p>
</body>
</html>
