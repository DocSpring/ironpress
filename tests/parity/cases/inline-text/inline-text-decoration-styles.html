<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dotted, dashed and double text decorations</title>
<style>
  @page { size: 360px 192px; margin: 0; }
  html { font-family: ParitySans; font-size: 16px; line-height: 30px; background: #ffffff; }
  body { margin: 12px; }
  p { margin: 0; }
</style>
</head>
<body>
  <p><span style="text-decoration: underline dotted">dotted underline</span> <span style="text-decoration: underline dashed">dashed underline</span></p>
  <p><span style="text-decoration: underline double">double underline</span> <span style="text-decoration: overline double">overline</span></p>
  <p><span style="text-decoration-line: line-through; text-decoration-style: double">struck twice</span> <span style="text-decoration: underline dashed #c0392b">red dashes</span></p>
  <p style="font-size: 28px; line-height: 50px"><span style="text-decoration: underline dotted">Large dots</span></p>
</body>
</html>
