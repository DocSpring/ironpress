<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inline-blocks nested five deep keep their text</title>
<style>
  @page { size: 320px 120px; margin: 0; }
  html { font-family: ParitySans; font-size: 16px; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; }
  .ib { display: inline-block; padding: 4px 6px; border: 2px solid #1f4fa8; background: #e8eefb; }
  .ib .ib { border-color: #2e7d32; background: #e7f4e8; }
  .ib .ib .ib { border-color: #c62828; background: #fbe9e9; }
  .ib .ib .ib .ib { border-color: #6a1b9a; background: #f3e8f8; }
  .ib .ib .ib .ib .ib { border-color: #ef6c00; background: #fff1e0; }
</style>
</head>
<body>
  <div class="ib">One <div class="ib">Two <div class="ib">Three <div class="ib">Four <div class="ib">Five</div></div></div></div></div>
</body>
</html>
