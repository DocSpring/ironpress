<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>atomic inline boxes in table cells, list items, flex and grid items</title>
<style>
  @page { size: 424px 360px; margin: 16px; }
  html { font-family: ParitySans; font-size: 14px; line-height: 20px; background: #ffffff; }
  body { margin: 0; }
  .ib { display: inline-block; width: 48px; border: 2px solid #3a5a40; background: #dad7cd; vertical-align: middle; }
  .ib .in { display: block; height: 24px; background: #a3b18a; font-size: 11px; }
  table { border-collapse: collapse; margin-bottom: 10px; }
  td { border: 1px solid #9e9e9e; padding: 2px 4px; }
  ul { margin: 0 0 10px; }
  .flex { display: flex; gap: 10px; background: #eeeeee; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 220px 1fr; background: #eeeeff; margin-bottom: 10px; }
  img { width: 30px; height: 15px; }
</style>
</head>
<body>
  <table><tr>
    <td>cell <span class="ib"><span class="in">A</span></span> text</td>
    <td><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAUCAIAAABwJOjsAAAAKklEQVR42u3NoREAAAyDQPZfOt0gJrLc4RBPoMSwE0oICwsLCwsLC/+BD/ci5EbyNw65AAAAAElFTkSuQmCC"> image</td>
    <td>flex <span style="display: inline-flex; gap: 2px"><b>x</b><b>y</b></span></td>
  </tr></table>
  <ul>
    <li>list <span class="ib"><span class="in">B</span></span> item</li>
    <li><p style="margin: 0">loose <span class="ib"><span class="in">C</span></span> para</p></li>
  </ul>
  <div class="flex"><div><span>flex <span class="ib"><span class="in">D</span></span> item</span></div><div>next</div></div>
  <div class="flex"><div style="flex: 1">grows <span class="ib"><span class="in">E</span></span> wide</div><div style="width: 100px">fixed</div></div>
  <div class="grid"><div><span>grid <span class="ib"><span class="in">F</span></span> item</span></div><div>next</div></div>
</body>
</html>
