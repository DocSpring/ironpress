<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>an isolate that wraps across lines keeps each line in visual order</title>
<style>
  @page { size: 320px 200px; margin: 0; }
  html { font-family: ParitySans; font-size: 16px; line-height: 24px; background: #ffffff; }
  body { margin: 12px; }
  p { margin: 0 0 6px; background: #eef1f8; }

</style>
</head>
<body>
  <p style="width: 220px">Start <span dir="rtl">שלום עולם זה טקסט ארוך בעברית שעוטף</span>: 3 posts and more words here.</p>
  <p dir="rtl" style="width: 220px">שלום <span dir="ltr">Hello there, my friend, 42!</span> עולם ועוד מילים</p>
</body>
</html>
