<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>definition lists, figures, address and preformatted blocks</title>
<style>
  @page { size: 360px 432px; margin: 0; }
  html { font-family: ParitySans; font-size: 16px; line-height: 20px; background: #ffffff; }
  body { margin: 0 12px; }
  dl, dt, dd, figure, figcaption, address, pre, xmp, listing, blockquote { background: #eef1f8; }
  dt { background: #dde4f2; }
</style>
</head>
<body>
  <dl><dt>Invoice</dt><dd>INV-204, due on receipt</dd><dt>Customer</dt><dd>Example Ltd</dd></dl>
  <figure><figcaption>Figure 1. Monthly totals</figcaption></figure>
  <address>1 Example Street<br>Wellington</address>
  <pre>Qty  Item
  2  Widget</pre>
  <xmp>Raw <b>markup</b></xmp>
  <listing>listing</listing>
  <blockquote>A quoted line.</blockquote>
</body>
</html>
